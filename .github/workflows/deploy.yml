name: deploy

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          # Build and tag with SHA
          docker build . -t tapader5765/cli-portfolio-cicd:${GITHUB_SHA}
          # Also tag as latest for Render auto-deploy
          docker tag tapader5765/cli-portfolio-cicd:${GITHUB_SHA} tapader5765/cli-portfolio-cicd:latest

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Push Docker images
        run: |
          docker push tapader5765/cli-portfolio-cicd:${GITHUB_SHA}
          docker push tapader5765/cli-portfolio-cicd:latest

      - name: Trigger Render deploy
        run: |
          curl -X POST https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID }} \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
